<!DOCTYPE html>
<html>
<head>
    <title>Maintenance Login</title>
</head>
<body>

    <h2>Maintenance Team Login</h2>

    <form method="POST">
        {% csrf_token %}

        <label>Name:</label>
        <input type="text" name="name" required>
        <br><br>

        <label>Phone:</label>
        <input type="text" name="phone" required>
        <br><br>

        <button type="submit">Login</button>
    </form>

</body>
</html>
