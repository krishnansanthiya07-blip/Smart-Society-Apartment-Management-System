{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Profile</title>

    <link rel="stylesheet" href="{% static 'core/style.css' %}">

    <style>
        .profile-page {
            min-height: 100vh;
            padding: 40px 20px;
            background: linear-gradient(135deg, #dbeafe, #ccfbf1);
        }

        .profile-container {
            max-width: 850px;
            margin: auto;
            background: rgba(255,255,255,0.95);
            padding: 40px;
            border-radius: 22px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.12);
        }

        .profile-container h1 {
            color: #0b1f33;
            margin-bottom: 30px;
        }

        .profile-card {
            background: #f8fafc;
            padding: 25px;
            border-radius: 15px;
            border-left: 5px solid #0f3d5e;
        }

        .profile-card p {
            color: #172033;
            font-size: 17px;
            margin: 15px 0;
        }

        .profile-card strong {
            color: #0b1f33;
        }

        .back-btn {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 22px;
            background: #0f3d5e;
            color: white !important;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }
    </style>
</head>

<body class="profile-page">

    <div class="profile-container">

        <h1>👤 My Profile</h1>

        <div class="profile-card">

            <p>
                <strong>Name:</strong>
                {{ resident.name }}
            </p>

            <p>
                <strong>Email:</strong>
                {{ resident.email }}
            </p>

            <p>
                <strong>Phone:</strong>
                {{ resident.phone }}
            </p>

            <p>
                <strong>Apartment:</strong>
                {{ resident.apartment.apartment_number }}
            </p>

        </div>

        <a href="{% url 'resident_dashboard' %}" class="back-btn">
            ← Back to Dashboard
        </a>

    </div>

</body>
</html>
