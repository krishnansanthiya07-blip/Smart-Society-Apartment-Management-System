{% load static %}

<!DOCTYPE html>
<html>
<head>
    <title>My Profile</title>
</head>

<body>

    <h1>My Profile</h1>

    <p><b>Name:</b> {{ resident.name }}</p>
    <p><b>Apartment Number:</b> {{ resident.apartment.apartment_number }}</p>
    <p><b>Floor:</b> {{ resident.apartment.floor }}</p>
    <p><b>Phone:</b> {{ resident.phone }}</p>
    <p><b>Email:</b> {{ resident.email }}</p>

    <a href="{% url 'resident_dashboard' %}">
        Back to Dashboard
    </a>

</body>
</html>
