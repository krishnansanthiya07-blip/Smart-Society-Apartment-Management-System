    <!DOCTYPE html>
<html>
<head>
    <title>Payments</title>
</head>

<body>

    <h1>Payments</h1>

    {% for payment in payments %}
    <p><b>Amount:</b> ₹{{ payment.amount }}</p>
    <p><b>Payment Date:</b> {{ payment.payment_date }}</p>
    <p><b>Status:</b> {{ payment.status }}</p>
    <hr>
{% empty %}
    <p>No payment records found.</p>
{% endfor %}

</body>
</html>
