{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Verify OTP - Smart Society</title>

    <link rel="stylesheet" href="{% static 'core/style.css' %}">
</head>

<body>

    <div class="login-container">

        <h2>🔐 Verify OTP</h2>

        <p>OTP has been sent to your registered email.</p>

        <form method="POST">
            {% csrf_token %}

            <input
                type="text"
                name="otp"
                placeholder="Enter 6-digit OTP"
                maxlength="6"
                minlength="6"
                pattern="[0-9]{6}"
                inputmode="numeric"
                required
            >

            <button type="submit">
                Verify OTP
            </button>
        </form>

    </div>

</body>
</html>
