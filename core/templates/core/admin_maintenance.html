{% load static %}

<!DOCTYPE html>
<html>
<head>
    <title>Manage Maintenance Team</title>
    <link rel="stylesheet" href="{% static 'core/style.css' %}">
</head>

<body>

<div class="container">

    <h1>Manage Maintenance Team</h1>

    <a href="{% url 'add_maintenance_member' %}">
        <button>Add Maintenance Member</button>
    </a>

    <br><br>

    {% for team in teams %}

        <div class="payment-card">

            <p><b>Name:</b> {{ team.name }}</p>
            <p><b>Role:</b> {{ team.role }}</p>
            <p><b>Phone:</b> {{ team.phone }}</p>

            <a href="{% url 'edit_maintenance_member' team.id %}">
                <button>Edit</button>   
            </a>

            <a href="{% url 'delete_maintenance_member' team.id %}"
            onclick="return confirm('Are you sure you want to delete this member?');">
                <button>Delete</button>
            </a>

        </div>

        <br>

    {% empty %}

        <p>No maintenance team members found.</p>

    {% endfor %}

    <br>

    <a href="{% url 'admin_dashboard' %}">
        Back to Dashboard
    </a>

</div>

</body>
</html>
