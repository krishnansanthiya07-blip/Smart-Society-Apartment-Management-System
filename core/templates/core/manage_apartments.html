{% load static %}

<!DOCTYPE html>
<html>
<head>
    <title>Manage Apartments</title>
    <link rel="stylesheet" href="{% static 'core/style.css' %}">
</head>

<body>

<div class="container">

    <h1>Manage Apartments</h1>

    {% for apartment in apartments %}
        <div class="payment-card">
            <p><b>Apartment Number:</b> {{ apartment.apartment_number }}</p>
            <p><b>Floor:</b> {{ apartment.floor }}</p>
            <p><b>Block:</b> {{ apartment.block }}</p>
        </div>

    {% empty %}
        <p>No apartments found.</p>

    {% endfor %}

    <br>

    <a href="{% url 'admin_dashboard' %}">
        Back to Dashboard
    </a>

</div>

</body>
</html>
