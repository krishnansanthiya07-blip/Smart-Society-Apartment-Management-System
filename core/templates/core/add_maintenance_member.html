{% load static %}

<!DOCTYPE html>
<html>
<head>
    <title>Add Maintenance Member</title>
    <link rel="stylesheet" href="{% static 'core/style.css' %}">
</head>

<body>

<div class="container">

    <h1>Add Maintenance Team Member</h1>

    <form method="POST">
        {% csrf_token %}

        <label>Name:</label><br>
        <input type="text" name="name" required><br><br>

        <label>Role:</label><br>
        <input type="text" name="role" placeholder="Example: Plumber" required><br><br>

        <label>Phone:</label><br>
        <input type="text" name="phone" required><br><br>

        <button type="submit">Add Member</button>
    </form>

    <br>

    <a href="{% url 'admin_maintenance' %}">
        Back to Maintenance Team
    </a>

</div>

</body>
</html>
